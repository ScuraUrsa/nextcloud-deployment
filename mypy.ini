# mypy configuration for the test suite (run as `mypy tests/` in CI).
#
# The shared helpers (tests/utils, tests/conftest.py, tests/unit) are fully
# typed and checked with --strict.  The live-API test modules are mostly
# unannotated pytest functions, so for those we only relax the
# "every def must be annotated" rules; their bodies are still type-checked.
[mypy]
python_version = 3.11
strict = True
warn_unused_configs = True
# Third-party packages without type information (e.g. caldav) are not errors.
ignore_missing_imports = True

[mypy-tests.test_admin.*,tests.test_billing.*,tests.test_collaboration.*,tests.test_content.*,tests.test_core.*,tests.test_identity.*,tests.test_performance.*,tests.test_security.*,tests.test_tiers.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
