---
# Staging: VirtualBox VM "nextcloud-staging" on Filip's laptop (host-only network,
# DHCP reservation 192.168.56.111). Ubuntu cloud image user is "ubuntu" (passwordless sudo).
#
# From a control node:   ansible-playbook -i inventory/staging/hosts.yml playbooks/nextcloud_core.yml -e @<secrets>
# On the VM itself:      add  -c local -l nextcloud-staging
all:
  children:
    nextcloud_servers:
      hosts:
        nextcloud-staging:
          ansible_host: "{{ lookup('env', 'STAGING_HOST') | default('192.168.56.111', true) }}"
          ansible_user: "{{ lookup('env', 'ANSIBLE_USER') | default('ubuntu', true) }}"
          ansible_become: true
    database_servers:
      hosts:
        nextcloud-staging:
    monitoring_servers:
      hosts:
        nextcloud-staging:
