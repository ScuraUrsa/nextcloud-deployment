name: Backup Verification

on:
  schedule:
    - cron: '0 1 * * 0'  # Sunday 01:00 UTC = 03:00 CEST
  workflow_dispatch:

permissions:
  issues: write

jobs:
  verify-backups:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH client and Borg
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client borgbackup
      - name: Pre-flight — check backup host and SSH key are configured
        id: preflight
        run: |
          HOST="${{ vars.PRODUCTION_HOST }}"
          if [ -z "$HOST" ]; then
            HOST="${{ secrets.PRODUCTION_HOST }}"
          fi
          if [ -z "$HOST" ]; then
            echo "::notice::PRODUCTION_HOST is not set (neither as var nor secret) — skipping backup verification"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${{ secrets.PRODUCTION_SSH_KEY }}" ]; then
            echo "::notice::PRODUCTION_SSH_KEY is not set — skipping backup verification"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${{ secrets.BORG_PASSPHRASE }}" ]; then
            echo "::notice::BORG_PASSPHRASE is not set — skipping backup verification"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"
          echo "Backup host and credentials configured — proceeding with verification"
      - name: Setup SSH
        if: steps.preflight.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ steps.preflight.outputs.host }}" >> ~/.ssh/known_hosts
      - name: Check Borg repository integrity
        if: steps.preflight.outputs.skip != 'true'
        run: |
          export BORG_PASSPHRASE="${{ secrets.BORG_PASSPHRASE }}"
          borg check --verify-data ssh://borg@${{ steps.preflight.outputs.host }}/./nextcloud
      - name: Verify recoverability (dry-run extract)
        if: steps.preflight.outputs.skip != 'true'
        run: |
          export BORG_PASSPHRASE="${{ secrets.BORG_PASSPHRASE }}"
          LATEST=$(borg list --last 1 --format "{archive}" ssh://borg@${{ steps.preflight.outputs.host }}/./nextcloud)
          borg extract --dry-run ssh://borg@${{ steps.preflight.outputs.host }}/./nextcloud::$LATEST data/nextcloud/admin/files/welcome.txt
      - name: Verify PostgreSQL dump in backup
        if: steps.preflight.outputs.skip != 'true'
        run: |
          export BORG_PASSPHRASE="${{ secrets.BORG_PASSPHRASE }}"
          LATEST=$(borg list --last 1 --format "{archive}" ssh://borg@${{ steps.preflight.outputs.host }}/./nextcloud)
          borg extract --stdout ssh://borg@${{ steps.preflight.outputs.host }}/./nextcloud::$LATEST tmp/nextcloud_pre_backup.sql | head -1
      - name: Verify Keycloak realm export
        if: steps.preflight.outputs.skip != 'true'
        run: |
          export BORG_PASSPHRASE="${{ secrets.BORG_PASSPHRASE }}"
          LATEST=$(borg list --last 1 --format "{archive}" ssh://borg@${{ steps.preflight.outputs.host }}/./nextcloud)
          borg extract --stdout ssh://borg@${{ steps.preflight.outputs.host }}/./nextcloud::$LATEST tmp/keycloak-realm-export.json | jq -r '.id'
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Backup verification failed',
              body: `Weekly backup verification failed.\n\nCheck logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['backup', 'incident']
            });
